<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S. Mustafa</title>
    <meta name="description" content="Physics student · computational physics, simulation, PINNs. وبلاگ مصطفی" />
    <script>
      // Set theme + language before first paint so there is no flash.
      (function () {
        try {
          var l = localStorage.getItem("lang") || "fa";
          var t = localStorage.getItem("theme") ||
            (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          var d = document.documentElement;
          d.lang = l; d.dir = l === "fa" ? "rtl" : "ltr"; d.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
